name: fill-nix-cache
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

enable-email-notifications: true
enable-openid-connect: true

jobs:
  fetch-forgejo-token:
    runs-on: ubuntu-latest
    outputs:
      forgejo-token: ${{ steps.fetch-jwt.outputs.jwt }}
    steps:
      - name: Fetch JWT for package publishing
        id: fetch-jwt
        env:
          AUD: "u:5:992a86e6-3eef-4dd6-b42f-87688cff80a1"
        run: |
          jwt=$( \
            curl --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" \
            | jq -r ".value" \
          )
          echo "::add-mask::$jwt"
          echo "jwt=$jwt" >> $FORGEJO_OUTPUT

  generate-build-matrix:
    runs-on: nixos-latest
    outputs:
      systems: ${{ steps.discover-nix-systems.outputs.systems }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup caching
        uses: actions/cache@v6
        with:
          key: nix-cache-${{ hashFiles('flake.lock', 'flake.nix') }}
          path: "/root/.cache/nix/**"

      - id: discover-nix-systems
        name: Discover Nix Systems
        run: |
          nix profile add nixpkgs#jq
          echo "Converting flake to flake.json"
          nix flake show --json >flake.json
          echo "Querying flake.json for nixos configurations"
          SYSTEMS_JSON=$(jq <flake.json -c '.nixosConfigurations | map_values(select(.type == "nixos-configuration")) | keys_unsorted | map(select([.] | inside(["installer", "proxmox-lxc", "priv.srv.home.internal", "proxy.srv.home.internal"]) | not))')
          echo "systems=$SYSTEMS_JSON" >$FORGEJO_OUTPUT

  build-system:
    runs-on: nixos-latest
    needs: [ fetch-forgejo-token, generate-build-matrix ]
    strategy:
      matrix:
        system: ${{ fromJSON(needs.generate-build-matrix.outputs.systems) }}
    container:
      image: git.hanse.de/lilly/lillinfra-nix-builder
      volumes:
        - shared-nix-store:/shared-nix-store
    outputs:
      system-closures: ${{ steps.build-system.outputs.system-path }}
    steps:

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build and push System
        id: build-system
        uses: ./.forgejo/local-actions/build-nix-system
        with:
          system: ${{ matrix.system }}
          attic_url: "https://babe-do-you-need-anything-from-the-nix.store"
          attic_cache: "lillinfra"
          attic_token: ${{ secrets.NIX_CACHE_TOKEN }}
          forgejo_token: ${{ needs.fetch-forgejo-token.outputs.forgejo-token }}
          store_path: /shared-nix-store
          
