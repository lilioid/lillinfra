[bar.default]
center = [ "active_window", "privacy" ]
end = [ "tray", "media", "notifications", "volume", "bluetooth", "network", "battery", "control-center" ]
start = [ "launcher", "workspaces", "clock" ]
thickness = 30
widget_spacing = 8

[calendar]
enabled = true

    [calendar.account.ccchh_public]
    name = "CCCHH Public"
    server_url = "webcal://cloud.hamburg.ccc.de/remote.php/dav/public-calendars/QJAdExziSnNJEz5g/?export"
    type = "ics"

[control_center.calendar]
show_week_numbers = true

[[control_center.shortcuts]]
type = "keyboard_layout"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "dark_mode"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[hooks]
colors_changed = ""
theme_mode_changed = "systemctl --user reload app-com.mitchellh.ghostty.service"

[location]
address = "Hamburg, Germany"

[lockscreen]
