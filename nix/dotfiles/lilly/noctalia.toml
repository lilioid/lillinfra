[notification]
history_retention_hours = 3
max_visible = 3

[osd]
position = "top_right"

    [osd.kinds]
    keyboard_backlight = false
    lock_keys = false
    media = false

[shell]
avatar_path = "/home/lilly/Sync/ProfilePictures/poly_fox.jpg"
clipboard_enabled = false
clipboard_keep_from_closed_apps = false
settings_show_advanced = true

    [shell.launcher]
    fetch_exchange_rates = false

    [shell.panel]
    open_near_click_control_center = true
    open_near_click_session = true
    session_position = "center"

    [shell.session]
    show_shortcuts = false

[theme]
builtin = "Rosé Pine"
community_palette = "Oxocarbon"
mode = "auto"
pure_black_dark = true
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "ghostty", "helix", "qt" ]

[wallpaper]
directory = "/home/lilly/Sync/Wallpapers"
directory_dark = "/home/lilly/Sync/Wallpapers/darkmode"
directory_light = "/home/lilly/Sync/Wallpapers/lightmode"

    [wallpaper.automation]
    enabled = true

    [wallpaper.default]
    path = "/home/lilly/Sync/Wallpapers/lightmode/daniel-clarke-yb-30sec-sh020-bg-paint-v021.jpg"

    [wallpaper.last]
    path = "/home/lilly/Sync/Wallpapers/lightmode/daniel-clarke-yb-30sec-sh020-bg-paint-v021.jpg"

    [wallpaper.monitors.WL-1]
    path = "/home/lilly/Sync/Wallpapers/darkmode/nasa-53884.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/lilly/Sync/Wallpapers/lightmode/daniel-clarke-yb-30sec-sh020-bg-paint-v021.jpg"

[widget.active_window]
anchor = true
interactive = false
title_scroll = "on_hover"

[widget.brightness]
enabled = false

[widget.media]
hide_when_no_media = true
show_progress = true

[widget.privacy]
hide_inactive = true
