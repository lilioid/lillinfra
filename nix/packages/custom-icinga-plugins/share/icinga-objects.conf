object NotificationCommand "ntfy-service-notification" {
	command = [ CustomPluginDir + "/ntfy-service-notification.py" ]

	arguments += {
		"--url" = {
			required = true
			value = "$notification_url$"
		}
		"--auth-token" = {
			required = true
			value = "$notification_auth_token$"
		}
		"--svc-name" = {
			required = true
			value = "$service.display_name$"
		}
		"--check-output" = {
			required = true
			value = "$service.output$"
		}
		"--last-state-change" = {
			required = true
			value = "$service.last_state_change$"
		}
		"--notification-comment" = {
			required = false
			value = "$notification.comment$"
			set_if = {{ macro("$notification.comment$") != null }}
		}
		"--notification-author" = {
			required = false
			value = "$notification.author$"
			set_if = {{ macro("$notification.author$") != null }}
		}
		"--notification-type" = {
			required = true
			value = "$notification.type$"
		}
		"--notification-state" = {
			required = true
			value = "$service.state$"
		}
	}

	vars += {
		notification_url = "$user.vars.ntfy_endpoint$"
		notification_auth_token = "$user.vars.ntfy_auth$"
	}
}

