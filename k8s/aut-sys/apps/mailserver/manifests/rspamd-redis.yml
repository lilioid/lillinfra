apiVersion: v1
kind: List
items:

  # service
  - apiVersion: v1
    kind: Service
    metadata:
      name: rspamd-redis
      labels: &labels
        app.kubernetes.io/name: rspamd-redis
        app.kubernetes.io/component: db
        app.kubernetes.io/part-of: mailserver
    spec:
      selector: *labels
      ports:
        - name: redis
          port: 6379
          targetPort: redis

  # deployment
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: rspamd-redis
      labels: *labels
    spec:
      selector:
        matchLabels: *labels
      template:
        metadata:
          labels: *labels
        spec:
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: rspamd-redis-data
          containers:
            - name: redis
              image: docker.io/redis
              args: [ "redis-server", "--save", "60", "1" ]
              volumeMounts:
                - name: data
                  mountPath: /data
              ports:
                - name: redis
                  containerPort: 6379
              readinessProbe:
                tcpSocket:
                  port: redis

  # data
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: rspamd-redis-data
      labels: *labels
    spec:
      accessModes: [ ReadWriteOnce ]
      resources:
        requests:
          storage: 1Gi
